name: One-time cleanup of merged Better OQB branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every non-main branch is already merged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            if [[ "$branch" == main || "$branch" == HEAD ]]; then continue; fi
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" HEAD; then
              echo "::error::Branch $branch has commits not merged into main; refusing deletion."
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin)
      - name: Delete merged branches, except main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            if [[ "$branch" == main || "$branch" == HEAD ]]; then continue; fi
            echo "Deleting refs/heads/$branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin)
