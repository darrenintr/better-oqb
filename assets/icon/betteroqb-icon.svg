<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">BetterOQB</title>
  <desc id="desc">Rounded question-card stack with a check mark, in Material You purple.</desc>
  <!-- Material You-inspired primary container -->
  <rect width="128" height="128" rx="30" fill="#EADDFF"/>
  <!-- Back question card -->
  <rect x="39" y="21" width="65" height="81" rx="13" fill="#D0BCFF" stroke="#8065B3" stroke-width="4.5"/>
  <!-- Main question card -->
  <rect x="23" y="34" width="72" height="76" rx="13" fill="#FBF8FF" stroke="#6750A4" stroke-width="5"/>
  <!-- Question mark -->
  <path d="M44.5 57.5c.8-8.5 6.5-13.5 15-13.5 8.7 0 14.6 5.2 14.6 13.1 0 6-3.4 9.4-9.3 13.6-3.8 2.7-5.1 5-5.1 8.6" stroke="#6750A4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="59.7" cy="90.3" r="3.6" fill="#6750A4"/>
  <!-- Answer check accent -->
  <circle cx="94" cy="95" r="18" fill="#6750A4" stroke="#EADDFF" stroke-width="4"/>
  <path d="m85.5 95.2 5.5 5.4 11.5-12.1" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
