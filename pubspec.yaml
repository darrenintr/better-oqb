name: better_oqb
description: A responsive Flutter shell for the real OQB web application.
publish_to: "none"
version: 0.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_widget_from_html_core: ^0.17.4
  webview_cef: ^0.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/oqb_bridge.js
    - assets/oqb_network_probe.js
    - assets/oqb_api_client.js
    - assets/oqb_data_bridge.js

  # Kiln type: variable fonts, SIL Open Font License (see assets/fonts/OFL-*.txt).
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
